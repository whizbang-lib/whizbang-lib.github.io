site_name: Whizbang Documentation
site_url: https://whizbang-docs.readthedocs.io/
site_description: >-
  Documentation for Whizbang - a zero-reflection, AOT-compatible .NET library
  for building event-driven, CQRS, and event-sourced applications.
repo_url: https://github.com/whizbang-lib/whizbang
repo_name: whizbang-lib/whizbang

theme:
  name: material
  custom_dir: rtd/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - announce.dismiss

docs_dir: rtd/_build/docs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Link checks for `mkdocs build --strict` (run on every PR by ci.yml, "Build Read the Docs site").
# rtd/build.py resolves the main site's link styles (no .md, site-absolute, other sections), so
# anything still unresolved here is a real dead link on Read the Docs and fails the build.
# Anchors stay at info until the known mismatches are fixed (see the follow-up issue).
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

