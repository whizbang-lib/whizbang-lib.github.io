name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate front-matter (released docs)
        run: pnpm run validate-frontmatter

      # Living docs: samples tagged {testFile, testMethod} must match the
      # referenced library test body (warning mode until adoption grows).
      - name: Checkout library for sample-drift check
        uses: actions/checkout@v7
        with:
          repository: whizbang-lib/whizbang
          ref: develop
          path: .whizbang-lib

      - name: Verify sample drift
        run: WHIZBANG_LIB_PATH="$GITHUB_WORKSPACE/.whizbang-lib" node src/scripts/verify-sample-drift.mjs

      - name: Build
        run: pnpm run build

  # Read the Docs builds only after a merge to main, so a change that breaks its build (an
  # unparseable mkdocs.yml, a dead link on the mirror) would otherwise merge green and surface
  # days later on the Read the Docs dashboard (#762). This runs exactly what .readthedocs.yaml
  # runs, on the same Python, in strict mode: rtd/build.py, then mkdocs build --strict, whose
  # link checks are set in mkdocs.yml.
  rtd:
    name: Build Read the Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python (as .readthedocs.yaml)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rtd/requirements.txt

      - name: Install MkDocs
        run: pip install -r rtd/requirements.txt

      - name: Generate the Read the Docs source
        run: python rtd/build.py

      - name: Build with MkDocs (strict)
        run: mkdocs build --strict --site-dir rtd/_site

  notify-success:
    name: Notify Success
    needs: [ build ]
    if: success() && github.event_name == 'push'
    uses: ./.github/workflows/notify-build-status.yml
    with:
      status: success
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
      PUSHOVER_USER_KEY_2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
      PUSHOVER_USER_KEY_3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
      PUSHOVER_USER_KEY_4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
      PUSHOVER_USER_KEY_5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
      PUSHOVER_USER_KEY_6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
      PUSHOVER_USER_KEY_7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
      PUSHOVER_USER_KEY_8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
      PUSHOVER_USER_KEY_9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
      PUSHOVER_USER_KEY_10: ${{ secrets.PUSHOVER_USER_KEY_10 }}

  notify-failure:
    name: Notify Failure
    needs: [ build ]
    if: failure()
    uses: ./.github/workflows/notify-build-status.yml
    with:
      status: failure
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
      PUSHOVER_USER_KEY_2: ${{ secrets.PUSHOVER_USER_KEY_2 }}
      PUSHOVER_USER_KEY_3: ${{ secrets.PUSHOVER_USER_KEY_3 }}
      PUSHOVER_USER_KEY_4: ${{ secrets.PUSHOVER_USER_KEY_4 }}
      PUSHOVER_USER_KEY_5: ${{ secrets.PUSHOVER_USER_KEY_5 }}
      PUSHOVER_USER_KEY_6: ${{ secrets.PUSHOVER_USER_KEY_6 }}
      PUSHOVER_USER_KEY_7: ${{ secrets.PUSHOVER_USER_KEY_7 }}
      PUSHOVER_USER_KEY_8: ${{ secrets.PUSHOVER_USER_KEY_8 }}
      PUSHOVER_USER_KEY_9: ${{ secrets.PUSHOVER_USER_KEY_9 }}
      PUSHOVER_USER_KEY_10: ${{ secrets.PUSHOVER_USER_KEY_10 }}
