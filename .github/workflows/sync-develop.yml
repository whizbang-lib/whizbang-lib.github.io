name: Sync main into develop

# Reinforces the branch strategy: after ANYTHING lands on main (a release, a hotfix,
# a direct merge), make sure develop catches up. This is title-independent — unlike
# release.yml's sync-develop job, which only fires when the merged PR is titled
# `chore(release): vX.Y.Z`, so a hand-cut release (or any other path to main) would
# otherwise leave develop stranded and the next release re-diverges.
#
# Conflict handling: the library's CI pushes machine-generated test-status JSON to
# main on every run, so main/develop routinely conflict on src/assets/data/test-status/**.
# Those conflicts are auto-resolved with MAIN's side (newer CI data; develop's copies are
# stale by construction). Any OTHER conflict falls back to a plain main -> develop PR for
# a human — generated data is the only thing this workflow ever resolves on its own.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main into develop
    runs-on: ubuntu-latest
    steps:
      - name: Check whether develop is behind
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AHEAD=$(gh api "repos/$REPO/compare/develop...main" --jq '.ahead_by')
          echo "main is $AHEAD commit(s) ahead of develop."
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.compare.outputs.ahead != '0'
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main, auto-resolving generated test-status with main's side
        if: steps.compare.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-main-auto"
          git checkout -B "$BRANCH" origin/develop

          if git merge origin/main --no-edit; then
            echo "Clean merge."
          else
            OTHER=$(git diff --name-only --diff-filter=U | grep -v '^src/assets/data/test-status/' || true)
            if [ -n "$OTHER" ]; then
              echo "::warning::Conflicts outside generated test-status need a human:"
              echo "$OTHER"
              git merge --abort
              # Fall back to the classic main -> develop PR so a human resolves it.
              PR=$(gh pr list --repo "$REPO" --base develop --head main --state open --json number --jq '.[0].number // empty')
              if [ -z "$PR" ]; then
                gh pr create --repo "$REPO" --base develop --head main \
                  --title "chore: sync main into develop (auto — needs manual conflict resolution)" \
                  --body "Automated sync found conflicts outside the machine-generated test-status data; a human must resolve them."
              fi
              exit 0
            fi
            # Test-status only: take main's side (newer CI data) and complete the merge.
            git checkout --theirs -- src/assets/data/test-status/
            git add src/assets/data/test-status/
            git commit --no-edit
            echo "Auto-resolved test-status conflicts with main's side."
          fi

          git push -f origin "$BRANCH"

          PR=$(gh pr list --repo "$REPO" --base develop --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --repo "$REPO" --base develop --head "$BRANCH" \
              --title "chore: sync main into develop (auto)" \
              --body "Automated \`main\` → \`develop\` sync after a push to main. Machine-generated \`test-status\` conflicts (if any) were auto-resolved with main's newer CI data; a merge commit preserves main's ancestry so the sync converges." \
              | sed -E 's#.*/pull/([0-9]+).*#\1#')
          fi
          echo "Sync PR: #$PR"

          # Wait for the Build check, then land with a MERGE COMMIT (squash would strip
          # main's ancestry and the next push to main would re-diverge forever).
          if gh pr checks "$PR" --repo "$REPO" --watch --fail-fast; then
            gh pr merge "$PR" --repo "$REPO" --merge \
              || echo "::warning::Merge failed; sync PR #$PR left open for manual merge."
          else
            echo "::warning::Checks failed on sync PR #$PR; left open for a human."
          fi
