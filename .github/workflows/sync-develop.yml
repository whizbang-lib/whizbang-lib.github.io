name: Sync main into develop

# Reinforces the branch strategy: after ANYTHING lands on main (a release, a hotfix,
# a direct merge), make sure develop catches up. This is title-independent — unlike
# release.yml's sync-develop job, which only fires when the merged PR is titled
# `chore(release): vX.Y.Z`, so a hand-cut release (or any other path to main) would
# otherwise leave develop stranded and the next release re-diverges.
#
# Conflict handling: the library's CI pushes machine-generated test-status JSON to
# main on every run, so main/develop routinely conflict on src/assets/data/test-status/**.
# Those conflicts are auto-resolved with MAIN's side (newer CI data; develop's copies are
# stale by construction). Any OTHER conflict falls back to a plain main -> develop PR for
# a human — generated data is the only thing this workflow ever resolves on its own.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every write goes through the release app, so nothing here needs more than read.
permissions:
  contents: read

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main into develop
    runs-on: ubuntu-latest
    # The release app's secrets live in this environment (develop, main and release/v* only).
    environment: release-app
    steps:
      # The release app publishes the sync branch, opens the PR and merges it, so the PR runs its own
      # checks: GitHub starts no workflow for a push or PR made with GITHUB_TOKEN.
      - name: Mint the release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check whether develop is behind
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AHEAD=$(gh api "repos/$REPO/compare/develop...main" --jq '.ahead_by')
          echo "main is $AHEAD commit(s) ahead of develop."
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.compare.outputs.ahead != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Merge main, auto-resolving generated test-status with main's side
        if: steps.compare.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-main-auto"
          git checkout -B "$BRANCH" origin/develop

          if git merge origin/main --no-edit; then
            echo "Clean merge."
          else
            OTHER=$(git diff --name-only --diff-filter=U | grep -v '^src/assets/data/test-status/' || true)
            if [ -n "$OTHER" ]; then
              echo "::warning::Conflicts outside generated test-status need a human:"
              echo "$OTHER"
              git merge --abort
              # Fall back to the classic main -> develop PR so a human resolves it.
              PR=$(gh pr list --repo "$REPO" --base develop --head main --state open --json number --jq '.[0].number // empty')
              if [ -z "$PR" ]; then
                gh pr create --repo "$REPO" --base develop --head main \
                  --title "chore: sync main into develop (auto — needs manual conflict resolution)" \
                  --body "Automated sync found conflicts outside the machine-generated test-status data; a human must resolve them."
              fi
              exit 0
            fi
            # Machine-generated data only: take main's side (newer CI data) and complete the
            # merge. test-status/ alone was not enough — the library's CI also pushes
            # code-tests-map.json and code-docs-map.json, so every sync after 2026-09-08 hit a
            # non-test-status conflict, fell through to "leave it for a human", and #606 sat open
            # for 18 days while develop drifted 234 commits behind.
            git checkout --theirs -- src/assets/data/test-status/ \
                                     src/assets/code-tests-map.json \
                                     src/assets/code-docs-map.json
            git add src/assets/data/test-status/ \
                    src/assets/code-tests-map.json \
                    src/assets/code-docs-map.json
            git commit --no-edit
            echo "Auto-resolved test-status conflicts with main's side."
          fi

          # Not git push: develop requires signed commits. The script recreates the merge through the API,
          # which GitHub signs as the app, and moves the branch (forced: it is rebuilt on every run).
          pwsh .github/scripts/Publish-SignedCommit.ps1 -Repository "$REPO" -Branch "$BRANCH" -Force

          PR=$(gh pr list --repo "$REPO" --base develop --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --repo "$REPO" --base develop --head "$BRANCH" \
              --title "chore: sync main into develop (auto)" \
              --body "Automated \`main\` → \`develop\` sync after a push to main. Machine-generated \`test-status\` conflicts (if any) were auto-resolved with main's newer CI data; a merge commit preserves main's ancestry so the sync converges." \
              | sed -E 's#.*/pull/([0-9]+).*#\1#')
          fi
          echo "Sync PR: #$PR"

          # Wait for the PR's own Build (the app opened it, so it ran), then land with a MERGE COMMIT
          # (squash would strip main's ancestry and the next push to main would re-diverge forever).
          SHA=$(git rev-parse HEAD)
          RESULT=pending
          for _ in $(seq 1 60); do
            RESULT=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "Build")] | .[0].conclusion // "pending"')
            case "$RESULT" in pending|null|"") sleep 20 ;; *) break ;; esac
          done
          if [ "$RESULT" = success ]; then
            # --admin uses the app's ruleset bypass: the sync carries main's already-reviewed changes,
            # including files code owners approved there, which the app cannot approve again.
            gh pr merge "$PR" --repo "$REPO" --merge --admin \
              || echo "::warning::Merge failed; sync PR #$PR left open for manual merge."
          else
            echo "::warning::Build on sync PR #$PR ended '$RESULT'; left open for a human."
          fi
